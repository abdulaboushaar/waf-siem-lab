name: waf-siem-lab

services:
  db:
    image: mysql:8.0
    container_name: lab-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # SECURITY-RELEVANT: no ports: block. The database is reachable only on the
    # internal compose network.
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [labnet]

  app:
    build: ./app
    container_name: lab-app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASS: ${MYSQL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    # SECURITY-RELEVANT: no ports: block anymore. The app is no longer reachable
    # from the host. The WAF is now the only entry point, and it reaches the app
    # over the internal network as http://app:80.
    volumes:
      - app_logs:/var/log/app
    networks: [labnet]

  waf-init:
    image: busybox:1.36
    container_name: lab-waf-init
    command: sh -c "mkdir -p /vol && chown -R 101:101 /vol"
    volumes:
      - modsec_audit:/vol
    restart: "no"
    networks: [labnet]

  waf:
    image: owasp/modsecurity-crs@sha256:1cf0a567e88e3b71862a3bc009dcc28ee620971cc672aa564872a3052edb5680
    container_name: lab-waf
    restart: unless-stopped
    env_file:
      - waf/common.env
      - waf/${WAF_PL:-pl1}.env
    depends_on:
      app:
        condition: service_started
      waf-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - modsec_audit:/var/log/modsec
      # Exclusion is a documented remediation, not part of the raw measurement.
      # Re-enable it only for the "tuned" comparison run (see DECISIONS D-0010).
      # - ./waf/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:/etc/modsecurity.d/owasp-crs/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf:ro
    networks: [labnet]

volumes:
  db_data:
  app_logs:
  modsec_audit:

networks:
  labnet:
    driver: bridge