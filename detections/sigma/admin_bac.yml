title: Admin Panel Accessed By Non-Admin Role
id: 80fccc81-284d-4cfa-9276-d660a92a07ae
status: experimental
description: >
  admin.php granted admin access to a request whose role is not admin, indicating
  broken access control. Note: on the current app data.role reflects the client
  cookie, so this fires only once the authenticated session role is logged.
logsource:
  product: waf_siem_lab
  service: app
detection:
  selection:
    path|contains: '/admin.php'
    outcome: 'admin_allowed'
  filter_admin:
    role: 'admin'
  condition: selection and not filter_admin
falsepositives:
  - A legitimate admin whose role label is spelled differently (administrator, superadmin).
level: high
tags:
  - attack.privilege-escalation
  - attack.t1548
