# waf/rules/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
#
# Mounted over the CRS "before CRS" exclusion hook so it is loaded before the
# CRS attack rules are evaluated.
#
# PURPOSE: fix a false positive where a benign apostrophe in the search box
# (for example "Builder's Choice") trips SQL injection rules on the q parameter.
#
# SCOPE: only requests to /search.php, and only the ARGS:q target. The guard
# rule matches the path in phase 1; ctl:ruleRemoveTargetById applies to the
# CURRENT transaction only, so SQLi detection on q on any other path, and on
# every other parameter of /search.php, is left fully in place.
#
# HOW TO FILL THIS IN CORRECTLY: with the WAF running, reproduce the false
# positive, open the JSON audit log, and read the ruleId values that matched
# ARGS:q. Replace the ids below with the ones YOUR log actually shows. The ids
# listed are the common apostrophe culprits in CRS 4, but confirm them against
# your own audit entry rather than trusting this list.

SecRule REQUEST_FILENAME "@endsWith /search.php" \
    "id:10001,\
     phase:1,\
     pass,\
     nolog,\
     t:none,\
     ctl:ruleRemoveTargetById=942100;ARGS:q,\
     ctl:ruleRemoveTargetById=942110;ARGS:q,\
     ctl:ruleRemoveTargetById=942190;ARGS:q,\
     ctl:ruleRemoveTargetById=942330;ARGS:q,\
     ctl:ruleRemoveTargetById=942440;ARGS:q"
